[project]
name = "hyunscartoon"
version = "0.1.0"
description = "AI Webtoon Generator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pillow>=8.2.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
]

[tool.vercel]
entrypoint = "backend.main:app"
